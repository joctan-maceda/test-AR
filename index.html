<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test AR</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

 <a-scene embedded arjs="trackingMethod: best;">
  
    <a-marker type="pattern" url="pattern-qr.patt">
        <a-entity 
          gltf-model="url(honey.glb)"
          scale="0.5 0.5 0.5"
          position="0 0 0"
          rotation="90 0 0">
        </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <!-- Mensaje de ayuda para debug manual -->
  <div id="debug" style="position: fixed; left:10px; bottom:10px; background: rgba(0,0,0,0.5); color: #fff; padding:6px 8px; font-size:13px; border-radius:6px;">
    1 Si el cubo amarillo aparece sobre el marcador → el QR/pattern funciona. Si el cubo aparece pero el modelo no → problema con el .glb (ruta, formato o carga).
  </div>

</body>
</html>
