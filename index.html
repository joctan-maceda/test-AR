<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test AR</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="trackingMethod: best;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true;">
    
  
    <a-entity 
        gltf-model="url(planta.glb)"
        scale="0.1 0.1 0.1"
        position="0 0 0"
        rotation="0 180 0">
     </a-entity>
     <a-box id="fallback-box" position="0 0.25 0" depth="0.5" height="0.5" width="0.5" material="color: yellow;"></a-box>


    <!-- Marker: usa tu pattern -->
    <a-marker type="pattern" url="pattern-qr_default.patt" emitevents="true">
     
      <!-- Fallback: un cubo que nos permite saber si el marcador se detecta -->
      
      
      <!-- Entidad que carga el modelo GLB desde el <a-assets> -->
      

    </a-marker>

    <!-- Cámara que funciona con AR.js -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- Mensaje de ayuda para debug manual -->
  <div id="debug" style="position: fixed; left:10px; bottom:10px; background: rgba(0,0,0,0.5); color: #fff; padding:6px 8px; font-size:13px; border-radius:6px;">
    1 Si el cubo amarillo aparece sobre el marcador → el QR/pattern funciona. Si el cubo aparece pero el modelo no → problema con el .glb (ruta, formato o carga).
  </div>

</body>
</html>
